name: Instagram reels

# Twice a day (UTC): ~11 AM and ~8 PM Pacific. GitHub can start scheduled runs a few minutes late.
on:
  schedule:
    - cron: "15 18 * * *"
    - cron: "15 3 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "morning or evening"
        default: "morning"
      rerender:
        description: "Re-make the video even if one exists (true/false)"
        default: "false"

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg and jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg jq
      - name: Make and send the reel
        env:
          REELS_SECRET: ${{ secrets.REELS_SECRET }}
          SITE: https://www.destinationsdaily.com
        run: |
          if [ -n "${{ github.event.inputs.slot }}" ]; then SLOT="${{ github.event.inputs.slot }}"; \
          elif [ "$(date -u +%H)" -ge 12 ]; then SLOT=morning; else SLOT=evening; fi
          if [ "${{ github.event.inputs.rerender }}" = "true" ]; then export RERENDER=1; fi
          export SLOT
          ./scripts/make-reel.sh
